<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | منتزهات</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a href="#main" class="skip-link">تخطَّ إلى المحتوى الرئيسي</a>
<div id="navbar-root"></div>

<main id="main">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>إنشاء حساب جديد</h1>
      <p class="sub">انضم إلينا لتخطيط زياراتك وحجز تذاكرك بسهولة.</p>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="name">الاسم الكامل</label>
          <input type="text" id="name" name="name" placeholder="اسمك الكامل" autocomplete="name">
          <span class="error-msg"></span>
        </div>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email">
          <span class="error-msg"></span>
        </div>
        <div class="field">
          <label for="phone">رقم الهاتف</label>
          <input type="tel" id="phone" name="phone" placeholder="0911234567" autocomplete="tel">
          <span class="error-msg"></span>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password">
            <span class="error-msg"></span>
          </div>
          <div class="field">
            <label for="confirm">تأكيد كلمة المرور</label>
            <input type="password" id="confirm" name="confirm" placeholder="••••••••" autocomplete="new-password">
            <span class="error-msg"></span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">إنشاء حساب</button>
      </form>

      <p class="auth-switch">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
    </div>
  </div>
</main>

<div id="footer-root"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/components.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
