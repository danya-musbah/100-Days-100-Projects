<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المنتزهات | منتزهات</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="dash-overlay" id="dashOverlay"></div>
<div class="dash-shell">
  <aside class="dash-sidebar" id="dashSidebar">
    <div class="dash-brand">
      <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/></svg></span>
      منتزهات
    </div>
    <nav class="dash-nav">
      <a href="dashboard.html">الرئيسية</a>
      <a href="parks.html" class="active">المنتزهات</a>
      <a href="managers.html">مديرو المنتزهات</a>
      <a href="statistics.html">الإحصائيات</a>
      <div class="divider"></div>
      <a href="#" onclick="ppLogout(); return false;">تسجيل الخروج</a>
    </nav>
  </aside>

  <div class="dash-main">
    <button class="dash-mobile-toggle" id="dashMobileToggle" aria-label="فتح القائمة">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="dash-topbar">
      <div>
        <h1>إدارة المنتزهات</h1>
        <p class="sub">إضافة، تعديل، أو حذف المنتزهات على المنصة</p>
      </div>
      <button class="btn btn-primary" onclick="ppOpenParkModal()">إضافة منتزه</button>
    </div>

    <div class="dash-panel" id="parksTableWrap"></div>
  </div>
</div>

<div class="modal-overlay" id="parkModalOverlay">
  <div class="modal" style="max-width:540px;">
    <h3 id="parkModalTitle">إضافة منتزه</h3>
    <form id="parkForm">
      <div class="field-row">
        <div class="field"><label for="pName">اسم المنتزه</label><input type="text" id="pName" name="name"></div>
        <div class="field"><label for="pCity">المدينة</label><input type="text" id="pCity" name="city"></div>
      </div>
      <div class="field"><label for="pAddress">العنوان</label><input type="text" id="pAddress" name="address"></div>
      <div class="field-row">
        <div class="field"><label for="pPhone">رقم الهاتف</label><input type="tel" id="pPhone" name="phone"></div>
        <div class="field"><label for="pHours">ساعات العمل</label><input type="text" id="pHours" name="hours"></div>
      </div>
      <div class="field"><label for="pPrice">السعر يبدأ من (د.ل)</label><input type="number" id="pPrice" name="price_from" min="0"></div>
      <div class="field"><label for="pDesc">الوصف</label><textarea id="pDesc" name="description" rows="2"></textarea></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">حفظ</button>
        <button type="button" class="btn btn-outline" onclick="ppCloseParkModal()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/components.js"></script>
<script src="../js/super-admin.js"></script>
<script>
  ppInitSuperAdminShell();
  ppRenderSuperAdminParks();
  document.getElementById('parkForm').addEventListener('submit', ppSubmitParkForm);
</script>
</body>
</html>
