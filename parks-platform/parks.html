<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جميع المنتزهات | منتزهات</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-active-link="المنتزهات">
<a href="#main" class="skip-link">تخطَّ إلى المحتوى الرئيسي</a>
<div id="navbar-root"></div>

<main id="main">
  <section class="section" style="padding-top:36px;">
    <div class="container">
      <div class="section-header">
        <div>
          <span class="section-eyebrow">تصفّح</span>
          <h2 class="section-title">جميع المنتزهات</h2>
          <p class="section-sub" id="resultsCount"></p>
        </div>
      </div>

      <form class="filters-bar" onsubmit="return false;">
        <div class="field search-box" style="margin-bottom:0;">
          <label for="parkSearch" class="visually-hidden">بحث</label>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="parkSearch" placeholder="ابحث بالاسم أو المدينة...">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="cityFilter" class="visually-hidden">المدينة</label>
          <select id="cityFilter"></select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="statusFilter" class="visually-hidden">الحالة</label>
          <select id="statusFilter">
            <option value="">كل الحالات</option>
            <option value="مفتوح">مفتوح</option>
            <option value="مغلق مؤقتًا">مغلق مؤقتًا</option>
            <option value="مغلق">مغلق</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="sortSelect" class="visually-hidden">الترتيب</label>
          <select id="sortSelect">
            <option value="rating_desc">الأعلى تقييمًا</option>
            <option value="price_asc">السعر: من الأقل للأعلى</option>
            <option value="price_desc">السعر: من الأعلى للأقل</option>
          </select>
        </div>
      </form>

      <div class="grid" id="parksGrid"></div>
      <div class="state-block" id="parksEmpty" style="display:none;">
        <div class="state-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <h3>لا توجد نتائج مطابقة</h3>
        <p>جرّب تعديل كلمات البحث أو الفلاتر المستخدمة.</p>
      </div>
    </div>
  </section>
</main>

<div id="footer-root"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/parks.js"></script>
</body>
</html>
