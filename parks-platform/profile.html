<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي | منتزهات</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-active-link="حسابي">
<a href="#main" class="skip-link">تخطَّ إلى المحتوى الرئيسي</a>
<div id="navbar-root"></div>

<main id="main">
  <section class="section" style="padding-top:36px;">
    <div class="container" style="max-width:820px;">
      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">ز</div>
        <div>
          <h1 style="font-size:1.7rem;" id="profileName">—</h1>
          <p style="opacity:.85;" id="profileEmail">—</p>
        </div>
      </div>

      <div class="stat-cards">
        <div class="stat-card"><b id="statTotalBookings">0</b><span>إجمالي الحجوزات</span></div>
        <div class="stat-card"><b id="statUpcomingBookings">0</b><span>الحجوزات القادمة</span></div>
      </div>

      <div class="dash-panel" style="background:var(--white);border:1px solid var(--line);border-radius:var(--radius-md);padding:24px;">
        <h3 style="font-weight:800;margin-bottom:16px;">بيانات الحساب</h3>
        <div class="info-list" style="margin-bottom:0;">
          <div class="info-item"><span class="label">الاسم</span><span class="value" id="infoName">—</span></div>
          <div class="info-item"><span class="label">البريد الإلكتروني</span><span class="value" id="infoEmail">—</span></div>
          <div class="info-item"><span class="label">رقم الهاتف</span><span class="value" id="infoPhone">—</span></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-root"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const session = ppRequireRole(['visitor']);
  if (!session) return;
  const user = PPStorage.findUserByEmail(session.email) || {};
  const bookings = PPStorage.getBookingsByUser(session.email);
  const today = new Date().toISOString().slice(0,10);
  const upcoming = bookings.filter(b => b.status === 'مؤكد' && b.date >= today);

  document.getElementById('profileAvatar').textContent = (session.name || 'ز')[0];
  document.getElementById('profileName').textContent = session.name;
  document.getElementById('profileEmail').textContent = session.email;
  document.getElementById('statTotalBookings').textContent = bookings.length;
  document.getElementById('statUpcomingBookings').textContent = upcoming.length;
  document.getElementById('infoName').textContent = session.name;
  document.getElementById('infoEmail').textContent = session.email;
  document.getElementById('infoPhone').textContent = user.phone || '—';
});
</script>
</body>
</html>
