<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Previewer — Write. Preview. Create.</title>
<meta name="description" content="A calm, editorial workspace for writing and previewing Markdown in real time.">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#editor-textarea">Skip to editor</a>

<div class="app-shell">

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="var(--deep-mocha)"/>
        <path d="M14 44V20h5.2l8.3 10.8L35.8 20H41v24h-5.6V28.9l-7.9 10.2h-.4L19.4 29v15H14z" fill="var(--lemon-chiffon)"/>
        <path d="M48.5 34.5v-9.9h4.2v9.9l4.6-4.9 3 2.9-8.6 9h-.4l-8.6-9 3-2.9z" fill="var(--tea-green)"/>
      </svg>
      <div class="brand-text">
        <h1>Markdown Previewer</h1>
        <p class="tagline">Write. Preview. Create.</p>
      </div>
    </div>

    <div class="header-actions">
      <span class="save-status" id="saveStatus" role="status" aria-live="polite">Saved</span>

      <button type="button" class="btn btn-ghost" id="newDocBtn" title="New document">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>New</span>
      </button>

      <button type="button" class="btn btn-ghost" id="clearBtn" title="Clear document">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 6h10M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6M6 6l.6 9.4A1.5 1.5 0 0 0 8.1 17h3.8a1.5 1.5 0 0 0 1.5-1.6L14 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span>Clear</span>
      </button>

      <div class="menu-wrap">
        <button type="button" class="btn btn-ghost" id="exportMenuBtn" aria-haspopup="true" aria-expanded="false" title="Export options">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 15.5h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span>Export</span>
        </button>
        <div class="menu" id="exportMenu" hidden>
          <button type="button" id="downloadMdBtn" class="menu-item">Download Markdown (.md)</button>
          <button type="button" id="exportHtmlBtn" class="menu-item">Export as HTML (.html)</button>
        </div>
      </div>

      <button type="button" class="btn btn-solid" id="fullscreenBtn" title="Toggle fullscreen">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H4a1 1 0 0 0-1 1v3M13 3h3a1 1 0 0 1 1 1v3M17 13v3a1 1 0 0 1-1 1h-3M3 13v3a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span class="sr-only">Toggle fullscreen focus mode</span>
      </button>
    </div>
  </header>

  <!-- ============ TOOLBAR ============ -->
  <div class="toolbar" role="toolbar" aria-label="Markdown formatting">
    <div class="toolbar-scroll">
      <button type="button" class="tool-btn" data-action="heading" aria-label="Heading" title="Heading (H)">
        <svg viewBox="0 0 20 20"><path d="M5 4v12M13 4v12M5 10h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tool-btn" data-action="bold" aria-label="Bold" title="Bold (Ctrl/Cmd+B)">
        <svg viewBox="0 0 20 20"><path d="M6 4h5a2.7 2.7 0 0 1 0 5.4H6zM6 9.4h5.6a2.8 2.8 0 0 1 0 5.6H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button type="button" class="tool-btn" data-action="italic" aria-label="Italic" title="Italic (Ctrl/Cmd+I)">
        <svg viewBox="0 0 20 20"><path d="M9 4h6M5 16h6M12 4 8 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tool-btn" data-action="strike" aria-label="Strikethrough" title="Strikethrough">
        <svg viewBox="0 0 20 20"><path d="M4 10h12M7 6.2c0-1.2 1.3-2.2 3-2.2s3 1 3 2.3c0 1-.6 1.7-1.6 2.1M6.8 13.7c0 1.3 1.4 2.3 3.2 2.3s3.1-.9 3.1-2.2c0-1-.6-1.7-1.7-2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
      </button>
      <span class="tool-divider" aria-hidden="true"></span>
      <button type="button" class="tool-btn" data-action="link" aria-label="Link" title="Link (Ctrl/Cmd+K)">
        <svg viewBox="0 0 20 20"><path d="M8.5 11.5 11.5 8.5M6 12 4.5 13.5a2.5 2.5 0 0 0 3.5 3.5L10 15M14 8l1.5-1.5a2.5 2.5 0 0 0-3.5-3.5L10 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button type="button" class="tool-btn" data-action="image" aria-label="Image" title="Image">
        <svg viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="7.5" cy="8.5" r="1.2" fill="currentColor"/><path d="m5 14 3.5-3.5L11 13l2-2 2.5 2.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="tool-btn" data-action="quote" aria-label="Quote" title="Blockquote">
        <svg viewBox="0 0 20 20"><path d="M5 8.5c0-1.9 1.3-3.2 3-3.5v1.4c-.8.3-1.4 1-1.4 2.1H8v3.5H4.5zM11.5 8.5c0-1.9 1.3-3.2 3-3.5v1.4c-.8.3-1.4 1-1.4 2.1h1.4v3.5h-3.5z" fill="currentColor"/></svg>
      </button>
      <span class="tool-divider" aria-hidden="true"></span>
      <button type="button" class="tool-btn" data-action="ul" aria-label="Bulleted list" title="Bulleted list">
        <svg viewBox="0 0 20 20"><circle cx="4.5" cy="5.5" r="1.1" fill="currentColor"/><circle cx="4.5" cy="10" r="1.1" fill="currentColor"/><circle cx="4.5" cy="14.5" r="1.1" fill="currentColor"/><path d="M8 5.5h8M8 10h8M8 14.5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tool-btn" data-action="ol" aria-label="Numbered list" title="Numbered list">
        <svg viewBox="0 0 20 20"><text x="2.3" y="7.2" font-size="4.8" fill="currentColor" font-family="inherit">1</text><text x="2.3" y="11.8" font-size="4.8" fill="currentColor">2</text><text x="2.3" y="16.4" font-size="4.8" fill="currentColor">3</text><path d="M8 5.5h8M8 10h8M8 14.5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="tool-btn" data-action="task" aria-label="Task list" title="Task list">
        <svg viewBox="0 0 20 20"><rect x="3.5" y="4" width="4" height="4" rx="0.8" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="m4.2 6 .9.9L6.8 5" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 6h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="3.5" y="12" width="4" height="4" rx="0.8" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10 14h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <span class="tool-divider" aria-hidden="true"></span>
      <button type="button" class="tool-btn" data-action="code" aria-label="Inline code" title="Inline code">
        <svg viewBox="0 0 20 20"><path d="M7 6 3.5 10 7 14M13 6l3.5 4-3.5 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button type="button" class="tool-btn" data-action="codeblock" aria-label="Code block" title="Code block">
        <svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="1.6" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M7 8 5.2 10 7 12M13 8l1.8 2-1.8 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button type="button" class="tool-btn" data-action="hr" aria-label="Horizontal rule" title="Horizontal rule">
        <svg viewBox="0 0 20 20"><path d="M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- ============ WORKSPACE ============ -->
  <div class="view-toggle" role="tablist" aria-label="Switch view">
    <button type="button" class="view-toggle-btn is-active" id="toggleEditView" role="tab" aria-selected="true">Markdown</button>
    <button type="button" class="view-toggle-btn" id="togglePreviewView" role="tab" aria-selected="false">Preview</button>
  </div>

  <main class="workspace" id="workspace">

    <!-- LEFT: EDITOR -->
    <section class="panel panel-editor" id="editorPanel" aria-label="Markdown editor">
      <div class="panel-head">
        <h2>Markdown</h2>
        <div class="panel-stats" id="editorStats">
          <span><strong id="statWords">0</strong> words</span>
          <span><strong id="statChars">0</strong> chars</span>
          <span><strong id="statLines">1</strong> lines</span>
        </div>
      </div>
      <div class="editor-body">
        <div class="gutter" id="gutter" aria-hidden="true"><div class="gutter-inner" id="gutterInner">1</div></div>
        <textarea
          id="editor-textarea"
          class="editor-textarea"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          aria-label="Markdown source"
          placeholder="Start writing Markdown to see your preview."
        ></textarea>
      </div>
    </section>

    <!-- RIGHT: PREVIEW -->
    <section class="panel panel-preview" id="previewPanel" aria-label="Rendered preview">
      <div class="panel-head">
        <h2>Preview</h2>
        <span class="panel-hint" id="parseStatus"></span>
      </div>
      <div class="preview-body" id="previewBody">
        <div class="preview-content markdown-body" id="previewContent"></div>
        <div class="empty-state" id="emptyState" hidden>
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 12h20l8 8v16a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V14a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M30 12v8h8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M14 26h14M14 31h14M14 21h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <p>Start writing Markdown to see your preview.</p>
        </div>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <span>Everything stays on this device — nothing is uploaded.</span>
  </footer>
</div>

<!-- Templates -->
<template id="linkPromptTemplate"></template>

<!-- Markdown parsing + sanitizing — bundled locally so the app works
     offline and isn't dependent on a CDN being reachable. See README. -->
<script src="js/vendor/marked.min.js"></script>
<script src="js/vendor/purify.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
